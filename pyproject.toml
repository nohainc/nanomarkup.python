[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomarkup"
dynamic = ["version"]
description = "Python parser and serializer for Nano Markup, a minimal, human-readable structured data format."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vitalii" }]
keywords = ["nanomarkup", "parser", "serializer", "data-format", "markup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nohainc/nanomarkup.python"
Repository = "https://github.com/nohainc/nanomarkup.python"
Specification = "https://github.com/nohainc/nanomarkup.spec"
Issues = "https://github.com/nohainc/nanomarkup.python/issues"

[project.scripts]
nanomarkup = "nanomarkup.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanomarkup = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "nanomarkup._version.__version__" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests/adapter.py"]
